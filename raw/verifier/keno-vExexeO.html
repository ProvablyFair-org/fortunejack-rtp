<div class="wrapper">
  <h1>FortuneJack Keno - Provably Fair Verifier</h1>
  <div class="seed"><label for="clientseed">Client Seed</label><input type="text" id="clientseed" placeholder="-"></div>
  <div class="seed"><label for="serverseed">Server Seed</label><input type="text" id="serverseed" placeholder="-"></div>
  <div class="row"><div class="seed"><label for="nonce">Nonce (Total bets made with pair)</label><input type="number" id="nonce" min="0" value="0"></div><div class="seed"><label for="userselected">Your numbers (optional, e.g. 3,7,15)</label><input type="text" id="userselected" placeholder="-"></div></div>
  <button id="calc" type="button">Calculate</button>
  <div id="hash" class="hash"></div>
  <div id="output"></div>
</div>
