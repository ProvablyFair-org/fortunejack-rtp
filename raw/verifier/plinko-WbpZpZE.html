<div class="wrapper">
  <h1>FortuneJack Plinko - Provably Fair Verifier</h1>
  <div class="seed"><label for="clientseed">Client Seed</label><input type="text" id="clientseed" placeholder="-"></div>
  <div class="seed"><label for="serverseed">Server Seed</label><input type="text" id="serverseed" placeholder="-"></div>
  <div class="row"><div class="seed"><label for="nonce">Nonce (Total bets made with pair)</label><input type="number" id="nonce" min="0" value="0"></div><div class="seed"><label for="rows">Rows</label><select id="rows" required><option value="" selected disabled hidden>Select</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option></select></div><div class="seed"><label for="risk">Difficulty</label><select id="risk" required><option value="" selected disabled hidden>Select</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></div></div>
  <button id="calc" type="button">Calculate</button>
  <div id="hash" class="hash"></div>
  <div id="output"></div>
</div>
